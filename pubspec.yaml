name: mcp_manager
description: "MCP Manager: connect MCP servers, inspect and test their tools, audit every call, and operate it all through a local LLM (Gemma 4 via Ollama or any OpenAI-compatible endpoint)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Gemma 4 (and any other model) through Ollama
  ollama_dart: ^4.0.0
  http: ^1.6.0

  go_router: ^18.1.0
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  fl_chart: ^1.2.0
  flutter_markdown_plus: ^1.0.12
  # Only used for non-secret defaults such as OLLAMA_URL. On web the .env asset
  # is shipped to the browser, so never put secrets in it.
  env_flutter: ^0.1.4
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  web: ^1.1.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
